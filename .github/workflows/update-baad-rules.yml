name: Update BAAD Rules

on:
  schedule:
    - cron: "15 7 * * 1"
      timezone: "America/Los_Angeles"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-baad-rules
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Restore the previous rules collection
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG=""
          if gh release view baad-current >/dev/null 2>&1; then
            RELEASE_TAG="baad-current"
          elif gh release view baaqmd-current >/dev/null 2>&1; then
            RELEASE_TAG="baaqmd-current"
          fi
          if [ -n "$RELEASE_TAG" ]; then
            gh release download "$RELEASE_TAG" \
              --pattern "BAAD_Current_Rules.zip" \
              --output latest_download.zip || gh release download "$RELEASE_TAG" \
              --pattern "BAAQMD_Current_Rules.zip" \
              --output latest_download.zip
            unzip -q -o latest_download.zip
            gh release download "$RELEASE_TAG" \
              --pattern "BAAD_Updater_Internal.zip" \
              --output internal_download.zip || gh release download "$RELEASE_TAG" \
              --pattern "BAAQMD_Updater_Internal.zip" \
              --output internal_download.zip || true
            if [ -f internal_download.zip ]; then
              unzip -q -o internal_download.zip
            fi
          fi

      - name: Update current rules
        run: python baad_rules_updater.py --config config.github.json

      - name: Package updated collection
        run: |
          zip -q -r BAAD_Current_Rules.zip BAAD_Current_Rules \
            -x "BAAD_Current_Rules/_Internal" \
               "BAAD_Current_Rules/_Internal/*"
          zip -q -r BAAD_Updater_Internal.zip \
            BAAD_Current_Rules/_Internal

      - name: Create or update the current release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view baad-current >/dev/null 2>&1; then
            gh release create baad-current \
              --title "Current BAAD Rules" \
              --notes "Automatically maintained current BAAD rule PDFs, archive, index, and combined bookmarked PDF." \
              --target "$GITHUB_SHA"
          fi
          gh release upload baad-current \
            BAAD_Current_Rules.zip \
            BAAD_Updater_Internal.zip \
            --clobber

      - name: Record successful run
        run: |
          mkdir -p status
          printf '%s\n' "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" > status/last_successful_run_utc.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add status/last_successful_run_utc.txt
          if ! git diff --cached --quiet; then
            git commit -m "Record successful BAAD update"
            git push
          fi
